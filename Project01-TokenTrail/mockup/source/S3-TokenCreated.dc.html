<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const n = 21, seed = 53, qr = [];
    const finder = (x, y, cx, cy) => {
      const dx = x - cx, dy = y - cy;
      if (dx < 0 || dy < 0 || dx > 6 || dy > 6) return null;
      return Math.max(Math.abs(dx - 3), Math.abs(dy - 3)) !== 2;
    };
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      let on = finder(x, y, 0, 0);
      if (on === null) on = finder(x, y, n - 7, 0);
      if (on === null) on = finder(x, y, 0, n - 7);
      if (on === null) {
        const sep = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
        if (sep) on = false;
        else if (y === 6 || x === 6) on = (x + y) % 2 === 0;
        else { const h = (Math.imul(x + 1, 73856093) ^ Math.imul(y + 1, 19349663) ^ Math.imul(seed, 83492791)) >>> 0; on = (h % 11) < 5; }
      }
      qr.push({ c: on ? '#0E1726' : '#FFFFFF' });
    }
    return { qr };
  }
}
</script>
